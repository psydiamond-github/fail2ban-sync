{% extends "base.html" %}
{% block title %}Группы — fail2ban-center{% endblock %}
{% block content %}
<h1>Группы агентов</h1>
<div class="panel">
  <table>
    <tr><th>Название</th><th>Родитель</th><th></th></tr>
    {% for g in groups %}
    <tr>
      <td>
        <form method="post" action="{{ url_for('admin_groups_rename', group_id=g['id']) }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input name="name" value="{{ g['name'] }}" style="width:12rem">
          <button type="submit" class="secondary">переим.</button>
        </form>
      </td>
      <td>
        <form method="post" action="{{ url_for('admin_groups_move', group_id=g['id']) }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <select name="parent_id" onchange="this.form.submit()">
            <option value="">— верхний уровень —</option>
            {% for p in groups if p['id'] != g['id'] %}
            <option value="{{ p['id'] }}" {% if p['id'] == g['parent_id'] %}selected{% endif %}>{{ p['name'] }}</option>
            {% endfor %}
          </select>
        </form>
      </td>
      <td>
        <form method="post" action="{{ url_for('admin_groups_delete', group_id=g['id']) }}" class="inline"
              onsubmit="return confirm('Удалить группу «{{ g['name'] }}»?')">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="danger">удалить</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3" class="muted">групп нет</td></tr>
    {% endfor %}
  </table>
</div>

<h2>Добавить группу</h2>
<div class="panel">
  <form method="post" action="{{ url_for('admin_groups_add') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input name="name" placeholder="название" required>
    <select name="parent_id">
      <option value="">— верхний уровень —</option>
      {% for g in groups %}<option value="{{ g['id'] }}">{{ g['name'] }}</option>{% endfor %}
    </select>
    <button type="submit">Создать</button>
  </form>
</div>
{% endblock %}
