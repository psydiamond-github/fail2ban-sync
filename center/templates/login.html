{% extends "base.html" %}
{% block title %}Вход — fail2ban-center{% endblock %}
{% block content %}
<div class="panel" style="max-width:360px;margin:3rem auto;">
  <h1>fail2ban-center</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>Логин<br><input name="username" autofocus required style="width:100%"></label></p>
    <p><label>Пароль<br><input type="password" name="password" required style="width:100%"></label></p>
    <button type="submit" style="width:100%">Войти</button>
  </form>
</div>
{% endblock %}
