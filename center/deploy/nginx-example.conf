# Пример reverse-proxy для fail2ban-center. TLS обязателен (§10 TZ) — центр принимает
# токены агентов и пароли пользователей, plain HTTP снаружи недопустим.
# После правки — включить F2B_CENTER_TRUST_PROXY=1 в systemd-юните (уже включено по
# умолчанию в deploy/fail2ban-center.service), иначе X-Forwarded-For не будет учитываться
# и ip_pin/аудит будут видеть IP самого nginx, а не реального клиента/агента.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name center.example.org;

    ssl_certificate     /etc/letsencrypt/live/center.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/center.example.org/privkey.pem;

    # Тела запросов агентов небольшие (JSON), но с запасом — на всякий случай.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Необязательно, но рекомендуется: базовый rate-limit на форму логина против перебора
    # пароля — раньше эта задача не стояла, т.к. доступ шёл только через SSH-туннель.
    # limit_req_zone $binary_remote_addr zone=f2bcenter_login:10m rate=5r/m;
    # location = /login {
    #     limit_req zone=f2bcenter_login burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8766;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

server {
    listen 80;
    listen [::]:80;
    server_name center.example.org;
    return 301 https://$host$request_uri;
}
