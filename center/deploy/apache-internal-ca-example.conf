# Reverse-proxy для fail2ban-center через Apache в изолированной сети без публичного
# DNS-имени (аналог nginx-internal-ca-example.conf) — сертификат от собственного
# внутреннего CA, см. deploy/generate-internal-ca.sh. Обычный (не mutual) TLS: агенты
# проверяют сертификат центра через доверенный CA, свой сертификат агенту не нужен.
#
#   sudo ./generate-internal-ca.sh --out-dir /etc/fail2ban-center/tls \
#       --ip <реальный IP центра> [--ip <ещё один, если слушает на нескольких>]
#
# ca.crt из этой же папки — раздать на каждый агент (install_agent.sh --center-ca-cert
# .../ca.crt) и один раз добавить в доверенные в браузере администратора.
#
# Нужны модули: mod_ssl, mod_proxy, mod_proxy_http, mod_headers
#   (Debian/Ubuntu: a2enmod ssl proxy proxy_http headers)
#
# После правки — включить F2B_CENTER_TRUST_PROXY=1 в systemd-юните (уже включено по
# умолчанию в deploy/fail2ban-center.service), иначе X-Forwarded-For не будет учитываться
# и ip_pin/аудит будут видеть IP самого Apache, а не реального клиента/агента.

# Изолированная сеть — редиректа с 80 на 443 намеренно нет: если сюда никогда не должно
# приходить plain HTTP, лучше явно ничего не слушать на 80, чем молчаливо на него полагаться.

<VirtualHost *:443>
    # Без DNS-имени ServerName можно не указывать вовсе — агенты и админ ходят по IP, а не
    # по имени; сертификат сверяется по SAN (--ip/--dns при генерации), а не этой директивой.

    SSLEngine on
    SSLCertificateFile      /etc/fail2ban-center/tls/server.crt
    SSLCertificateKeyFile   /etc/fail2ban-center/tls/server.key

    # Тела запросов агентов небольшие (JSON), но с запасом — на всякий случай.
    LimitRequestBody 2097152

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/
    # mod_proxy сам добавляет X-Forwarded-For — X-Forwarded-Proto нужно выставить руками,
    # иначе Flask/ProxyFix не узнает, что снаружи был HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyTimeout 60
</VirtualHost>
