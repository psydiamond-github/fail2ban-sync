# Reverse-proxy для fail2ban-center в изолированной сети без публичного DNS-имени, где
# Let's Encrypt (см. nginx-example.conf) не работает — сертификат от собственного
# внутреннего CA, см. deploy/generate-internal-ca.sh. Обычный (не mutual) TLS: агенты
# проверяют сертификат центра через доверенный CA, свой сертификат агенту не нужен.
#
#   sudo ./generate-internal-ca.sh --out-dir /etc/fail2ban-center/tls \
#       --ip <реальный IP центра> [--ip <ещё один, если слушает на нескольких>]
#
# ca.crt из этой же папки — раздать на каждый агент (install_agent.sh --center-ca-cert
# .../ca.crt) и один раз добавить в доверенные в браузере администратора.
#
# После правки — включить F2B_CENTER_TRUST_PROXY=1 в systemd-юните (уже включено по
# умолчанию в deploy/fail2ban-center.service), иначе X-Forwarded-For не будет учитываться
# и ip_pin/аудит будут видеть IP самого nginx, а не реального клиента/агента.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Без DNS-имени server_name можно не указывать вовсе (nginx примет любой Host) —
    # агенты и админ ходят по IP, а не по имени; сертификат сверяется по SAN (--ip/--dns
    # при генерации), а не по этой директиве.

    ssl_certificate     /etc/fail2ban-center/tls/server.crt;
    ssl_certificate_key /etc/fail2ban-center/tls/server.key;

    # Тела запросов агентов небольшие (JSON), но с запасом — на всякий случай.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Необязательно, но рекомендуется: базовый rate-limit на форму логина против перебора
    # пароля.
    # limit_req_zone $binary_remote_addr zone=f2bcenter_login:10m rate=5r/m;
    # location = /login {
    #     limit_req zone=f2bcenter_login burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8766;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# Изолированная сеть — редиректа с 80 на 443 намеренно нет: если сюда никогда не должно
# приходить plain HTTP, лучше явно ничего не слушать на 80, чем молчаливо на него полагаться.
