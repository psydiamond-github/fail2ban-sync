# Пример reverse-proxy для fail2ban-center через Apache (аналог nginx-example.conf, если
# на хосте уже стоит Apache и заводить ещё и nginx не хочется). TLS обязателен (§10 TZ) —
# центр принимает токены агентов и пароли пользователей, plain HTTP снаружи недопустим.
#
# Нужны модули: mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
#   (Debian/Ubuntu: a2enmod ssl proxy proxy_http headers rewrite)
#   (RHEL/REDOS: обычно уже собраны в httpd, только LoadModule в конфиге)
#
# После правки — включить F2B_CENTER_TRUST_PROXY=1 в systemd-юните (уже включено по
# умолчанию в deploy/fail2ban-center.service), иначе X-Forwarded-For не будет учитываться
# и ip_pin/аудит будут видеть IP самого Apache, а не реального клиента/агента.

<VirtualHost *:80>
    ServerName center.example.org
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName center.example.org

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/center.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/center.example.org/privkey.pem

    # Тела запросов агентов небольшие (JSON), но с запасом — на всякий случай.
    LimitRequestBody 2097152

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/
    # mod_proxy сам добавляет X-Forwarded-For — X-Forwarded-Proto нужно выставить руками,
    # иначе Flask/ProxyFix не узнает, что снаружи был HTTPS.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyTimeout 60
</VirtualHost>
